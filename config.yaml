  schema: public
subscriptions:
  schema_migration:
    stage: A
    diff_threshold_pct: 15
  keyword_recall_mode: or
  intent_profiles:
    - tag: MRE
      description: 多模态关系抽取相关论文
      enabled: true
      paper_sources:
        - arxiv
      keywords:
        - keyword: multimodal relation extraction
          keyword_cn: 多模态关系抽取
          query: extracting relations from multimodal data
        - keyword: cross-modal relation extraction
          keyword_cn: 跨模态关系抽取
          query: cross-modal relation extraction using vision and language
        - keyword: multimodal information extraction
          keyword_cn: 多模态信息抽取
          query: information extraction from multiple modalities
      intent_queries:
        - query: How to combine text and images for relation extraction?
          query_cn: 如何结合文本和图像进行关系抽取？
          enabled: true
          source: manual
          note: ''
        - query: state of the art multimodal relation extraction models
          query_cn: 最先进的多模态关系抽取模型
          enabled: true
          source: manual
          note: ''
        - query: multimodal relation extraction benchmark datasets
          query_cn: 多模态关系抽取基准数据集
          enabled: true
          source: manual
          note: ''
      updated_at: '2026-07-31T07:50:14.568Z'
    - tag: ml
      description: 查找多模态学习相关论文 包括模态不平衡 模态融合等
      enabled: true
      paper_sources:
        - arxiv
      keywords:
        - keyword: multimodal learning
          keyword_cn: 多模态学习
          query: multimodal learning methods combining different data modalities
        - keyword: modality imbalance
          keyword_cn: 模态不平衡
          query: addressing modality imbalance in multimodal learning
        - keyword: multimodal fusion
          keyword_cn: 多模态融合
          query: techniques for multimodal fusion in deep learning
        - keyword: cross-modal alignment
          keyword_cn: 跨模态对齐
          query: cross-modal alignment representation learning
        - keyword: multimodal representation
          keyword_cn: 多模态表示
          query: multimodal representation learning approaches
        - keyword: multimodal feature fusion
          keyword_cn: 多模态特征融合
          query: feature-level fusion methods for multimodal inputs
      intent_queries:
        - query: How to handle modality imbalance in multimodal learning?
          query_cn: 如何处理多模态学习中的模态不平衡问题？
          enabled: true
          source: manual
          note: ''
        - query: Latest techniques for multimodal fusion in neural networks
          query_cn: 神经网络中多模态融合的最新方法
          enabled: true
          source: manual
          note: ''
      updated_at: '2026-07-31T07:56:36.262Z'
